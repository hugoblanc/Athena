<ion-tabs>

  <!-- Tab bar épurée : 3 onglets essentiels. Propositions de loi et Infos
       restent accessibles via le menu « ··· » en tête des pages (cf.
       SecondaryMenuService). Home est remplacé par le Feed. -->
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="feed">
      <ion-icon name="newspaper-outline"></ion-icon>
      <ion-label>Actu</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="construction">
      <ion-icon name="bulb-outline"></ion-icon>
      <ion-label>Idées</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="podcasts">
      <ion-icon name="headset-outline"></ion-icon>
      <ion-label>Podcasts</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
