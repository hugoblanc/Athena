<ion-tabs>

  <!-- Tab bar : 4 onglets. Infos reste accessible via le menu « ··· » en tête
       des pages (cf. SecondaryMenuService). Home est remplacé par le Feed. -->
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="feed">
      <ion-icon name="newspaper-outline"></ion-icon>
      <ion-label>Actu</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="propositions">
      <ion-icon name="document-text-outline"></ion-icon>
      <ion-label>Lois</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="construction">
      <ion-icon name="bulb-outline"></ion-icon>
      <ion-label>Idées</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="podcasts">
      <ion-icon name="headset-outline"></ion-icon>
      <ion-label>Podcasts</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>

<!-- Filtre SVG de réfraction « liquid glass » : un bruit fractal sert de carte
     de déplacement qui déforme le contenu derrière la barre (façon lentille).
     Ne fonctionne que sur Chromium (Android WebView + Chrome) ; sur iOS/WebKit,
     seul le rebord spéculaire (::before) s'applique → dégradation propre. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquid-glass" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
    <feGaussianBlur in="noise" stdDeviation="0.02" result="blur" />
    <feDisplacementMap in="SourceGraphic" in2="blur" scale="45" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>
