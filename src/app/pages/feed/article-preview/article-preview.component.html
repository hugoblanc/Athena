<article class="sig-card">
  <div class="sig-card__media" *ngIf="mixedContent?.image?.url">
    <img class="sig-card__img" [src]="imageUrl" (error)="onImgError()" alt="" loading="lazy">
    <span class="sig-card__play" *ngIf="isVideo" aria-hidden="true">
      <ion-icon name="play"></ion-icon>
    </span>
  </div>

  <div class="sig-card__body">
    <div class="sig-card__kicker">
      <img class="sig-card__logo" [src]="mixedContent.metaMedia.logo" alt="">
      <span class="sig-card__source">{{mixedContent.metaMedia.title}}</span>
      <span class="sig-card__sep" *ngIf="mixedContent.publishedAt">·</span>
      <span class="sig-card__date" *ngIf="mixedContent.publishedAt">{{mixedContent.publishedAt | date:'d MMM yyyy'}}</span>
    </div>
    <h3 class="sig-card__title" [innerHTML]="mixedContent.title"></h3>
  </div>
</article>
